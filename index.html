<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Handle and ignore HMR WebSocket connection errors as specified by environment rules
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason ? (e.reason.message || String(e.reason)) : '';
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('@vite/client') !== -1 || reason.indexOf('transport') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = e && e.message ? e.message : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          function ViteHmrWebSocket(url, protocols) {
            var isHmr = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isHmr) {
              var target = new EventTarget();
              target.url = url;
              target.readyState = 1; // WebSocket.OPEN
              target.OPEN = 1;
              target.CONNECTING = 0;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.send = function() {};
              target.close = function() {};
              setTimeout(function() {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteHmrWebSocket.prototype = NativeWebSocket.prototype;
          ViteHmrWebSocket.OPEN = NativeWebSocket.OPEN;
          ViteHmrWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          ViteHmrWebSocket.CLOSING = NativeWebSocket.CLOSING;
          ViteHmrWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = ViteHmrWebSocket;
        }
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ece_theme');
          var isDark = saved === 'dark' || (saved === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
